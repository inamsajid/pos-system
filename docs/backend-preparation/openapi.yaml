openapi: 3.1.0
info:
  title: Northstar POS — Cloudflare Workers API
  version: 1.0.0
  description: >
    Production RESTful API specifications for the Northstar POS platform,
    engineered for Cloudflare Workers, Cloudflare D1, and Cloudflare R2.
    All monetary amounts are expressed in integer minor currency units (paise).
servers:
  - url: https://pos.northstarmarket.pk/api/v1
    description: Production Environment
  - url: https://staging-api.northstarmarket.pk/api/v1
    description: Staging Environment
  - url: http://localhost:8787/api/v1
    description: Local Development Environment

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __session
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BusinessIdHeader:
      name: X-Business-Id
      in: header
      required: true
      schema:
        type: string
      description: Target Business Context ID
    BranchIdHeader:
      name: X-Branch-Id
      in: header
      required: false
      schema:
        type: string
      description: Target Branch Context ID
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Stable UUIDv4 token for idempotent mutations

  schemas:
    StandardMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 50
        totalCount:
          type: integer
          example: 120
        totalPages:
          type: integer
          example: 3
        hasNextPage:
          type: boolean
          example: true

    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          example: INSUFFICIENT_STOCK
        message:
          type: string
          example: Insufficient inventory on hand.
        details:
          type: object
          additionalProperties: true

    ErrorEnvelope:
      type: object
      required:
        - success
        - error
        - requestId
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
          example: req_01hgb890123

    CategoryDTO:
      type: object
      required:
        - id
        - businessId
        - name
        - slug
        - displayOrder
        - status
        - productCount
        - activeProductCount
        - totalStockQuantity
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        businessId:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        parentId:
          type: string
          nullable: true
        displayOrder:
          type: integer
        status:
          type: string
          enum: [active, archived]
        productCount:
          type: integer
        activeProductCount:
          type: integer
        totalStockQuantity:
          type: number
        createdAt:
          type: string
        updatedAt:
          type: string

    CreateCategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        parentId:
          type: string
          nullable: true
        displayOrder:
          type: integer

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        parentId:
          type: string
          nullable: true
        displayOrder:
          type: integer
        status:
          type: string
          enum: [active, archived]

    ReplaceCategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        parentId:
          type: string
          nullable: true
        displayOrder:
          type: integer
          default: 0
        status:
          type: string
          enum: [active, archived]
          default: active

    ProductDTO:
      type: object
      required:
        - id
        - businessId
        - sku
        - name
        - unit
        - purchasePriceMinor
        - sellingPriceMinor
        - stockQuantity
        - status
      properties:
        id:
          type: string
        businessId:
          type: string
        sku:
          type: string
        barcode:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
        categoryName:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        unit:
          type: string
          enum: [piece, kg, gram, liter, meter, box, pack, dozen]
        purchasePriceMinor:
          type: integer
          description: Moving weighted average unit cost in paise
          example: 12000
        sellingPriceMinor:
          type: integer
          description: Retail selling price in paise
          example: 15000
        stockQuantity:
          type: number
          example: 45.5
        lowStockThreshold:
          type: number
          example: 10
        trackInventory:
          type: boolean
          example: true
        status:
          type: string
          enum: [active, archived]

    CreateProductRequest:
      type: object
      required:
        - name
        - sku
        - unit
        - purchasePriceMinor
        - sellingPriceMinor
      properties:
        name:
          type: string
        sku:
          type: string
        barcode:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        unit:
          type: string
          enum: [piece, kg, gram, liter, meter, box, pack, dozen]
        purchasePriceMinor:
          type: integer
        sellingPriceMinor:
          type: integer
        lowStockThreshold:
          type: number
          default: 5.0
        trackInventory:
          type: boolean
          default: true

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
        sku:
          type: string
        barcode:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        unit:
          type: string
          enum: [piece, kg, gram, liter, meter, box, pack, dozen]
        purchasePriceMinor:
          type: integer
        sellingPriceMinor:
          type: integer
        lowStockThreshold:
          type: number
        trackInventory:
          type: boolean
        status:
          type: string
          enum: [active, archived]

    ReplaceProductRequest:
      type: object
      required:
        - name
        - sku
        - unit
        - purchasePriceMinor
        - sellingPriceMinor
      properties:
        name:
          type: string
        sku:
          type: string
        barcode:
          type: string
          nullable: true
        categoryId:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        unit:
          type: string
          enum: [piece, kg, gram, liter, meter, box, pack, dozen]
        purchasePriceMinor:
          type: integer
        sellingPriceMinor:
          type: integer
        lowStockThreshold:
          type: number
          default: 5.0
        trackInventory:
          type: boolean
          default: true
        status:
          type: string
          enum: [active, archived]
          default: active

    CreateSaleItemRequest:
      type: object
      required:
        - productId
        - quantity
        - unitPriceMinor
      properties:
        productId:
          type: string
        quantity:
          type: number
          example: 2
        unitPriceMinor:
          type: integer
          example: 15000
        discountMinor:
          type: integer
          default: 0
          example: 500

    CreateSalePaymentRequest:
      type: object
      required:
        - method
        - amountMinor
      properties:
        method:
          type: string
          enum: [cash, card, bank-transfer, credit]
        amountMinor:
          type: integer
          example: 29500
        reference:
          type: string
          nullable: true

    CreateSaleRequest:
      type: object
      required:
        - customerId
        - items
        - payments
        - subtotalMinor
        - totalAmountMinor
      properties:
        customerId:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreateSaleItemRequest'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/CreateSalePaymentRequest'
        subtotalMinor:
          type: integer
          example: 30000
        discountType:
          type: string
          enum: [fixed, percent]
          default: fixed
        discountValue:
          type: number
          default: 0
        discountMinor:
          type: integer
          default: 500
        totalAmountMinor:
          type: integer
          example: 29500
        amountPaidMinor:
          type: integer
          example: 29500

    SaleDTO:
      type: object
      required:
        - id
        - saleNumber
        - receiptNumber
        - invoiceNumber
        - customerId
        - totalAmountMinor
        - amountPaidMinor
        - status
        - businessDateKey
        - createdAt
      properties:
        id:
          type: string
        saleNumber:
          type: string
        receiptNumber:
          type: string
        invoiceNumber:
          type: string
        customerId:
          type: string
        subtotalMinor:
          type: integer
        discountMinor:
          type: integer
        taxMinor:
          type: integer
        totalAmountMinor:
          type: integer
        amountPaidMinor:
          type: integer
        remainingBalanceMinor:
          type: integer
        status:
          type: string
          enum: [draft, completed, voided, partially_returned, returned]
        businessDateKey:
          type: string
          example: "2026-11-08"
        createdAt:
          type: string

    InvoiceDTO:
      type: object
      required:
        - id
        - invoiceNumber
        - saleId
        - customerId
        - totalAmountMinor
        - paidAmountMinor
        - remainingAmountMinor
        - paymentStatus
        - status
        - businessDateKey
        - createdAt
      properties:
        id:
          type: string
        businessId:
          type: string
        branchId:
          type: string
        invoiceNumber:
          type: string
        saleId:
          type: string
        customerId:
          type: string
        customerName:
          type: string
        businessDateKey:
          type: string
        totalAmountMinor:
          type: integer
        paidAmountMinor:
          type: integer
        remainingAmountMinor:
          type: integer
        paymentStatus:
          type: string
          enum: [paid, partial, unpaid]
        status:
          type: string
          enum: [active, voided]
        createdAt:
          type: string

    CustomerPaymentDTO:
      type: object
      required:
        - id
        - receiptNumber
        - customerId
        - amountMinor
        - unallocatedAmountMinor
        - source
        - businessDateKey
        - receivedBy
        - receivedAt
        - createdAt
      properties:
        id:
          type: string
        businessId:
          type: string
        branchId:
          type: string
        receiptNumber:
          type: string
        customerId:
          type: string
        customerName:
          type: string
        amountMinor:
          type: integer
        unallocatedAmountMinor:
          type: integer
        source:
          type: string
          enum: [pos_checkout, manual, online]
        businessDateKey:
          type: string
        receivedBy:
          type: string
        receivedAt:
          type: string
        createdAt:
          type: string

    CreateCustomerPaymentRequest:
      type: object
      required:
        - customerId
        - amountMinor
        - paymentMethods
      properties:
        branchId:
          type: string
        customerId:
          type: string
        amountMinor:
          type: integer
        paymentMethods:
          type: array
          items:
            type: object
            required:
              - method
              - amountMinor
            properties:
              method:
                type: string
                enum: [cash, card, bank_transfer, digital_wallet, other]
              amountMinor:
                type: integer
              reference:
                type: string
        allocations:
          type: array
          items:
            type: object
            required:
              - invoiceId
              - amountMinor
            properties:
              invoiceId:
                type: string
              amountMinor:
                type: integer
        notes:
          type: string

    CustomerLedgerEntryDTO:
      type: object
      required:
        - id
        - customerId
        - type
        - referenceId
        - referenceNumber
        - description
        - debitMinor
        - creditMinor
        - balanceMinor
        - businessDateKey
        - createdAt
      properties:
        id:
          type: string
        customerId:
          type: string
        type:
          type: string
          enum: [opening, invoice, payment, credit_note, void, adjustment]
        referenceId:
          type: string
        referenceNumber:
          type: string
        description:
          type: string
        debitMinor:
          type: integer
        creditMinor:
          type: integer
        balanceMinor:
          type: integer
        businessDateKey:
          type: string
        createdAt:
          type: string

paths:
  /auth/sign-in:
    post:
      summary: User Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Successful authentication
          headers:
            Set-Cookie:
              schema:
                type: string
                example: __session=token; HttpOnly; Secure; SameSite=Lax
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /categories:
    get:
      summary: List Categories
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdHeader'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, all]
        - name: parentId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of categories with statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryDTO'
                  requestId:
                    type: string
    post:
      summary: Create Category
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Created category
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CategoryDTO'

  /categories/{id}:
    get:
      summary: Get Category by ID
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CategoryDTO'
        '404':
          description: Category not found
    put:
      summary: Replace Category (Full Replacement)
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceCategoryRequest'
      responses:
        '200':
          description: Replaced category
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CategoryDTO'
    patch:
      summary: Update Category
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CategoryDTO'
    delete:
      summary: Soft-archive Category
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Archived category status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        example: archived

  /products:
    get:
      summary: List Products
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdHeader'
        - name: search
          in: query
          schema:
            type: string
        - name: sku
          in: query
          schema:
            type: string
        - name: barcode
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, all]
        - name: lowStock
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, sku, selling_price, purchase_price, stock, created_at, updated_at]
            default: name
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductDTO'
                  meta:
                    $ref: '#/components/schemas/StandardMeta'
                  requestId:
                    type: string
    post:
      summary: Create Product
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Created product
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProductDTO'

  /products/{id}:
    get:
      summary: Get Product by ID
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product detail with stock and category
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProductDTO'
        '404':
          description: Product not found
    put:
      summary: Replace Product (Full Replacement)
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceProductRequest'
      responses:
        '200':
          description: Replaced product
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProductDTO'
    patch:
      summary: Update Product
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProductDTO'
    delete:
      summary: Soft-archive Product
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Archived product status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      status:
                        type: string
                        example: archived

  /sales:
    post:
      summary: Complete POS Checkout
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdHeader'
        - $ref: '#/components/parameters/BranchIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSaleRequest'
      responses:
        '201':
          description: Sale completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SaleDTO'
                  requestId:
                    type: string
        '409':
          description: Idempotency conflict or concurrent update error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Domain business rule failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      summary: List Sales
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdHeader'
        - $ref: '#/components/parameters/BranchIdHeader'
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of sales
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SaleDTO'
                  meta:
                    $ref: '#/components/schemas/StandardMeta'

  /sales/{id}:
    get:
      summary: Get Sale Detail
      security:
        - SessionCookie: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BusinessIdHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sale details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SaleDTO'

  /sales/{id}/void:
    post:
